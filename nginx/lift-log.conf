location = /lift-log/api/health {
    proxy_pass http://127.0.0.1:3015;
    proxy_set_header Host $host;
    proxy_set_header X-Middleware-Subrequest "";
}

location = /lift-log/api/login {
    limit_req zone=lift_log_login burst=5 nodelay;
    limit_req zone=lift_log_login_total burst=10 nodelay;
    limit_req_status 429;
    client_body_buffer_size 4k;
    include snippets/lift-log-proxy.conf;
}

location = /lift-log {
    include snippets/lift-log-proxy.conf;
}

location ^~ /lift-log/ {
    include snippets/lift-log-proxy.conf;
}
