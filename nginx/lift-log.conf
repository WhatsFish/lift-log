location = /lift-log/api/health {
    proxy_pass http://127.0.0.1:3015;
    proxy_set_header Host $host;
    proxy_set_header X-Lift-User "";
    proxy_set_header X-Middleware-Subrequest "";
}

location = /lift-log {
    auth_basic "Lift Log";
    auth_basic_user_file /etc/nginx/.htpasswd-trading;
    include snippets/lift-log-proxy.conf;
}

location ^~ /lift-log/ {
    auth_basic "Lift Log";
    auth_basic_user_file /etc/nginx/.htpasswd-trading;
    include snippets/lift-log-proxy.conf;
}
